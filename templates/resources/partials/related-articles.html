{% if article.related_articles.length %}<section class="related-resources" aria-labelledby="related-resources-title"><div class="container"><p class="eyebrow">Keep Planning</p><h2 id="related-resources-title">Related renovation guides</h2><div class="related-resource-grid">{% for related in article.related_articles %}<article class="related-resource-card"><a href="{{ related.url }}"><img src="..{{ related.hero.src }}" alt="{{ related.hero.alt }}"><div><p class="resource-category">{{ related.category }}</p><h3>{{ related.title }}</h3><p>{{ related.summary }}</p><span class="text-link" aria-hidden="true">Read the guide →</span></div></a></article>{% endfor %}</div></div></section>{% endif %}
