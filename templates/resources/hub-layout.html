<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ pageTitle | escape }}</title>
  <meta name="description" content="{{ pageDescription | escape }}">
  <meta name="theme-color" content="#0D1B2A">
  <link rel="canonical" href="{{ canonical }}">
  <meta property="og:title" content="{{ pageTitle | escape }}">
  <meta property="og:description" content="{{ pageDescription | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ site.baseUrl }}{{ social.src }}">
  <meta property="og:image:alt" content="{{ social.alt | escape }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ site.baseUrl }}{{ social.src }}">
  <meta name="twitter:image:alt" content="{{ social.alt | escape }}">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/analytics.js"></script>
</head>
{% block extraHead %}{% endblock %}
<body class="generated-resource-hub compact-resource-hub">
<a class="skip" href="#main">Skip to content</a>
{% set resourceRoot = '' %}
{% include "resources/partials/header.html" %}
<main id="main">
{% block content %}{% endblock %}
{% include "resources/partials/hub-cta.html" %}
</main>
{% include "resources/partials/footer.html" %}
<noscript><style>.compact-resource-hub .site-header{position:static}.compact-resource-hub .menu-button{display:none}.compact-resource-hub .main-nav{display:flex;position:static}.compact-resource-hub .nav-row{flex-wrap:wrap}</style></noscript>
<script src="/js/site.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
